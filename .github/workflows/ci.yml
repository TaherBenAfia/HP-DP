name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    name: Run CLI Platform Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python and install dependencies
        run: |
          uv python pin 3.12
          uv sync --all-extras

      - name: Auto-fix Linter (Ruff)
        run: uv run ruff check --fix .

      - name: Run Full Pipeline via CLI Agent
        run: uv run python -m platform_cli run all

      - name: Run Pytest Suite and Save Results
        run: |
          uv run pytest --junitxml=pytest-results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          import json

          tree = ET.parse('pytest-results.xml')
          root = tree.getroot()

          summary = {
              'tests': root.attrib.get('tests', 0),
              'failures': root.attrib.get('failures', 0),
              'errors': root.attrib.get('errors', 0),
              'skipped': root.attrib.get('skipped', 0),
              'hostname': root.attrib.get('hostname', 'unknown'),
              'timestamp': root.attrib.get('timestamp', ''),
          }

          failures_errors = []
          for testcase in root.findall('.//testcase'):
              name = testcase.get('name')
              classname = testcase.get('classname', '')
              failure = testcase.find('failure')
              error = testcase.find('error')
              msg = ''
              if failure is not None:
                  msg = failure.get('message', '') + '\n' + (failure.text or '').strip()
              elif error is not None:
                  msg = error.get('message', '') + '\n' + (error.text or '').strip()
              failures_errors.append({
                  'name': name,
                  'classname': classname,
                  'result': testcase.get('result', 'unknown'),
                  'message': msg[:500] if msg else ''
              })

          with open('test-summary.json', 'w') as f:
              json.dump({'summary': summary, 'failures_errors': failures_errors}, f, indent=2)
          PY

      - name: Upload Test Summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: test-summary.json
          if-no-files-found: error

      - name: Check Mypy Critical Errors
        shell: bash
        run: |
          set +e
          RESULT=$(uv run mypy src/ 2>&1)
          STATUS=$?
          echo "$RESULT"

          ERROR_COUNT=$(printf '%s\n' "$RESULT" | grep -c "error:" || true)
          if [ "$STATUS" -ne 0 ] || [ "$ERROR_COUNT" -gt 0 ]; then
            echo "::error::Found $ERROR_COUNT mypy errors"
            printf '%s\n' "$RESULT" | grep "error:" | head -20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

          echo "::notice::No mypy errors found"
