name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run CLI Platform Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python and install dependencies
        run: |
          uv python pin 3.12
          uv sync --all-extras

      - name: Run Linter (Ruff)
        run: uv run ruff check .

      - name: Run Full Pipeline via CLI Agent
        run: uv run python -m platform_cli run all

      - name: Run Pytest Suite
        run: uv run pytest