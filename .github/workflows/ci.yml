name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run CLI Platform Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python and install dependencies
        run: |
          uv python pin 3.12
          uv sync --all-extras

      - name: Auto-fix Linter (Ruff)
        run: uv run ruff check --fix .

      - name: Run Full Pipeline via CLI Agent
        run: uv run python -m platform_cli run all

      - name: Run Pytest Suite and Save Results
        run: |
          uv run pytest --junitxml=pytest-results.xml
          python -c "
import xml.etree.ElementTree as ET
import json
import sys

tree = ET.parse('pytest-results.xml')
root = tree.getroot()

# Extract summary
summary = {
    'tests': root.attrib.get('tests', 0),
    'failures': root.attrib.get('failures', 0),
    'errors': root.attrib.get('errors', 0),
    'skipped': root.attrib.get('skipped', 0),
    'hostname': root.attrib.get('hostname', 'unknown'),
    'timestamp': root.attrib.get('timestamp', ''),
}

# Extract failure/error details
failures_errors = []
for testcase in root.findall('.//testcase'):
    name = testcase.get('name')
    classname = testcase.get('classname', '')
    result = testcase.get('result', 'unknown')
    
    failure = testcase.find('failure')
    error = testcase.find('error')
    
    msg = ''
    if failure is not None:
        msg = failure.get('message', '')
        # Get the full traceback text
        msg += '\\n' + (failure.text or '').strip()
    elif error is not None:
        msg = error.get('message', '')
        msg += '\\n' + (error.text or '').strip()
    
    failures_errors.append({
        'name': name,
        'classname': classname,
        'result': result,
        'message': msg[:500] if msg else ''  # truncate long messages
    })

result = {
    'summary': summary,
    'failures_errors': failures_errors
}

with open('test-summary.json', 'w') as f:
    json.dump(result, f, indent=2)
"

      - name: Commit Test Summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test-summary.json
          git commit -m "test: update test summary [skip ci]" || echo "No changes to commit"
          git push

      - name: Check Mypy Critical Errors
        run: |
          set +o pipefail
          RESULT=$(uv run mypy src/ 2>&1)
          ERROR_COUNT=$(echo "$RESULT" | grep -c "error:" || true)
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "::error::Found $ERROR_COUNT mypy errors"
            echo "$RESULT" | grep "error:" | head -20 | while read -r line; do
              echo "::error::${line}"
            done
          else
            echo "::notice::No mypy errors found"
          fi