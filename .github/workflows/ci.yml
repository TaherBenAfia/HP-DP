name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run CLI Platform Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python and install dependencies
        run: |
          uv python pin 3.12
          uv sync --all-extras

      - name: Auto-fix Linter (Ruff)
        run: uv run ruff check --fix .

      - name: Run Full Pipeline via CLI Agent
        run: uv run python -m platform_cli run all

      - name: Run Pytest Suite and Save Results
        run: |
          uv run pytest --junitxml=pytest-results.xml
          python .github/actions/pytest-summary.py

      - name: Commit Test Summary
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test-summary.json
          git commit -m "test: update test summary [skip ci]" || echo "No changes to commit"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

      - name: Check Mypy Critical Errors
        run: |
          set +o pipefail
          RESULT=$(uv run mypy src/ 2>&1)
          ERROR_COUNT=$(echo "$RESULT" | grep -c "error:" || true)
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "::error::Found $ERROR_COUNT mypy errors"
            echo "$RESULT" | grep "error:" | head -20 | while read -r line; do
              echo "::error::${line}"
            done
          else
            echo "::notice::No mypy errors found"
          fi