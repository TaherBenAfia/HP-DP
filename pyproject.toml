[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statseo-platform"
version = "1.0.0"
description = "Local-first, asset-centric analytical platform for multi-tenant SEO and sports data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "StatSEO Research" }]
keywords = ["analytics", "seo", "platform", "sports", "visibility"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pydantic>=2.0",
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
nlp = ["spacy>=3.7", "sentence-transformers>=2.2"]
graph = ["networkx>=3.2"]
duck = ["duckdb>=0.10"]
platform = [
    "polars>=1.0",
    "pyarrow>=14.0",
    "duckdb>=1.0",
    "deltalake>=1.0",
    "pandera>=0.20",
    "statsmodels>=0.14",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "streamlit>=1.35",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "httpx>=0.27",
    "pyiceberg>=0.7.0",
    "boto3>=1.34",
]
dev = ["pytest>=7.4", "pytest-asyncio>=0.21", "pytest-cov>=4.1", "mypy>=1.7", "ruff>=0.1", "pre-commit>=3.5"]
# Evidence-native lakehouse stack: open Iceberg/Polaris storage, Dagster +
# Temporal orchestration, causal core, governance and lineage tooling.
lakehouse = [
    "pyiceberg[sql-sqlite]>=0.7.0",
    "sqlmesh>=0.100",
    "dagster>=1.9",
    "temporalio>=1.7",
    "dowhy>=0.12",
    "econml>=0.15",
    "doubleml>=0.9",
    "evidently>=0.4",
    "openlineage-python>=1.15",
    "feast>=0.40",
    "lancedb>=0.10",
    "clickhouse-connect>=0.7",
    "dspy-ai>=2.6",
    "langgraph>=0.2",
]
all = ["playwright>=1.40", "spacy>=3.7", "sentence-transformers>=2.2", "networkx>=3.2", "duckdb>=0.10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "platform_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "build/", "dist/", ".venv/"]
[[tool.mypy.overrides]]
module = [
    "lxml.*",
    "bs4.*",
    "yaml",
    "aiohttp.*",
    "sklearn.*",
    "numpy.*",
    "pyarrow.*",
    "langdetect",
    "sentence_transformers",
    "brotli",
    "pandas",
    "statsmodels.*",
    "dowhy.*",
    "econml.*",
    "doubleml.*",
    "dspy.*",
    "evidently.*",
    "dagster.*",
    "langgraph.*",
    "temporalio.*",
    "pyiceberg.*",
    "feast.*",
    "lancedb.*",
    "clickhouse_connect.*",
    "sqlmesh.*",
    "openlineage.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# No per-file ignores needed; legacy scripts have been removed.

[tool.coverage.run]
source = ["src"]
omit = []
